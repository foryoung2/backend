spring:
  application:
    name: foryoung

  datasource:
    hikari:
      maximum-pool-size: 20
    url: jdbc:mysql://localhost:3306/foryoung
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database: mysql
    hibernate:
      ddl-auto: create
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: secret

kakao:
  client-id: clientId
  client-secret: clientSecret
  redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
